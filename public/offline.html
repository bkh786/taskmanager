<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Task Manager</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f4f7fb;color:#1c2430;text-align:center;padding:24px}
  .card{max-width:340px}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 6px}
  p{font-size:14px;color:#5b6675;margin:0 0 18px}
  button{background:#0a84ff;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Task Manager needs an internet connection. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
